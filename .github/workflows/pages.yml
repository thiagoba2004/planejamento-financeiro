name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "temas/**"
      - "cfp/**"
      - "gestao-financeira/**"
      - "casos/**"
      - "ferramentas/**"
      - "metricas/**"
      - "fontes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build public-only artifact
        run: |
          mkdir -p _site/assets _site/temas _site/cfp _site/gestao-financeira _site/casos _site/ferramentas _site/metricas _site/fontes
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          cp temas/*.html _site/temas/
          cp cfp/*.html _site/cfp/
          cp gestao-financeira/*.html _site/gestao-financeira/
          cp casos/*.html _site/casos/
          cp ferramentas/*.html _site/ferramentas/
          cp metricas/*.html _site/metricas/
          cp fontes/*.html _site/fontes/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
